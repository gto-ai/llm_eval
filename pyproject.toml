[project]
name = "llm-eval"
version = "0.1.0"
description = "Model deployment and LLM evaluation tools"
requires-python = ">=3.12"
dependencies = [
    "ais-bench-benchmark==3.1.20260630",
    "gradio>=6.26.0",
    "huggingface-hub>=0.34,<2",
    "transformers",
]

[project.scripts]
llm-eval-download-model = "model.download_model:main"
llm-eval-generate-dataset = "data.generate_dataset:main"
llm-eval-ui = "app.ui_main:main"
llm-eval-ui-deploy = "app.tab.ui_deploy:main"
llm-eval-ui-eval = "app.tab.ui_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "component", "data", "model", "util"]
